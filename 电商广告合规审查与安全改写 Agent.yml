    - data:
        code: "import re\nimport unicodedata\n\ndef main(text: str = \"\", **kwargs)\
          \ -> dict:\n    # 自动兼容 text 或 raw_text 传入\n    raw_text = text if text else\
          \ kwargs.get(\"raw_text\", \"\")\n    \n    if not raw_text:\n        return\
          \ {\n            \"has_violation\": False,\n            \"matched_words\"\
          : [],\n            \"violation_count\": 0,\n            \"est_fine\": \"\
          0 元\",\n            \"risk_level\": \"正常\"\n        }\n\n    # 1. 对抗清洗层\
          \ 1: Unicode NFKC 标准化 (将 ①、❶、全角数字等统一转为标准字符)\n    normalized = unicodedata.normalize('NFKC',\
          \ str(raw_text))\n\n    # 2. 对抗清洗层 2: 拼音与常见作弊变体映射\n    pinyin_map = {\n\
          \        \"die一\": \"第一\",\n        \"di一\": \"第一\",\n        \"d1\": \"\
          第一\",\n        \"ding级\": \"顶级\",\n        \"v信\": \"微信\",\n        \"vx\"\
          : \"微信\"\n    }\n    for variant, standard in pinyin_map.items():\n    \
          \    normalized = re.sub(re.escape(variant), standard, normalized, flags=re.IGNORECASE)\n\
          \n    # 3. 对抗清洗层 3: 去除文字间插入的干扰符号（如 顶_级、第*一、换季 烂 脸）\n    cleaned_for_match\
          \ = re.sub(r'[\\s_\\-\\*#~@\\.\\/\\\\\\|\\+]+', '', normalized)\n\n    #\
          \ 4. 高危广告法与行业黑词库\n    forbidden_rules = [\n        (r'国家级|世界级|最高级', '极限用语-国家级/顶级',\
          \ '20 万元 ~ 100 万元'),\n        (r'第[一1壹]|全网第[一1壹]|销量第[一1壹]|排名第[一1壹]', '极限用语-第一绝对化',\
          \ '20 万元 ~ 100 万元'),\n        (r'顶级|极品|极佳|绝无仅有|顶尖|史无前例', '极限用语-顶级绝对化', '20\
          \ 万元 ~ 100 万元'),\n        (r'首[款个席选家]|全国首[发家个]|全网首[发个]', '绝对化宣称-首个/首款',\
          \ '20 万元 ~ 100 万元'),\n        (r'100%有效|根除|根治|消炎|抗炎|药效|彻底解决|断根|换皮', '医疗/疗效绝对化宣称',\
          \ '10 万元 ~ 100 万元（涉嫌非药品宣称疗效）'),\n        (r'全网最低|跳楼价|亏本甩卖|史上最低', '价格欺诈与绝对化比价',\
          \ '5 万元 ~ 50 万元')\n    ]\n\n    matched_words = []\n    est_fines = []\n\
          \n    # 5. 在去干扰文本中执行正则硬拦截\n    for pattern, reason, fine in forbidden_rules:\n\
          \        found = re.findall(pattern, cleaned_for_match, flags=re.IGNORECASE)\n\
          \        if found:\n            matched_words.extend(list(set(found)))\n\
          \            est_fines.append(fine)\n\n    matched_words = list(dict.fromkeys(matched_words))\n\
          \    violation_count = len(matched_words)\n    has_violation = violation_count\
          \ > 0\n\n    if violation_count >= 2 or any('100 万元' in f for f in est_fines):\n\
          \        risk_level = \"极高风险（触发顶格硬拦截）\"\n        est_fine = \"20 万元 ~ 100\
          \ 万元（触发广告法第57条或涉及医疗功效严管）\"\n    elif violation_count == 1:\n        risk_level\
          \ = \"中高风险（存在违法宣称）\"\n        est_fine = est_fines[0] if est_fines else\
          \ \"20 万元 ~ 100 万元\"\n    else:\n        risk_level = \"合规/低风险\"\n     \
          \   est_fine = \"0 元（未触发硬性法规拦截）\"\n\n    return {\n        \"has_violation\"\
          : has_violation,\n        \"matched_words\": matched_words,\n        \"\
          violation_count\": violation_count,\n        \"est_fine\": est_fine,\n \
          \       \"risk_level\": risk_level\n    }"
